version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: aris-postgres
    environment:
      POSTGRES_USER: aris
      POSTGRES_PASSWORD: aris
      POSTGRES_DB: aris
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/versions/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro

  redis:
    image: redis:7
    container_name: aris-redis
    ports:
      - "6379:6379"

  api:
    image: python:3.11-slim
    container_name: aris-api
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: >
      sh -c "pip install -e .[api,pdf] &&
      uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://aris:aris@postgres:5432/aris
      REDIS_URL: redis://redis:6379/0
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    image: python:3.11-slim
    container_name: aris-worker
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: >
      sh -c "pip install -e .[api,pdf] &&
      python -m apps.worker.main"
    environment:
      DATABASE_URL: postgresql+asyncpg://aris:aris@postgres:5432/aris
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-aris-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
